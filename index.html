<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vLLM Ascend · PR 状态一览</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --fg-muted: #59636e;
  --border: #d1d9e0;
  --border-soft: #e7e9ee;
  --bg-subtle: #f6f8fa;
  --green-fg: #1a7f37; --green-bg: #dafbe1;
  --red-fg: #cf222e;   --red-bg: #ffebe9;
  --yellow-fg: #9a6700; --yellow-bg: #fff8c5;
  --purple-fg: #8250df; --purple-bg: #fbefff;
  --gray-fg: #59636e;  --gray-bg: #eff2f5;
  --blue-fg: #0969da;  --blue-bg: #ddf4ff;
  --darkred-fg: #82071e; --darkred-bg: #ffd8d3;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--fg);
  background: var(--bg);
}
a { color: var(--blue-fg); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); cursor: pointer; color: var(--fg);
}
button:hover { background: var(--bg-subtle); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: #1f883d; border-color: rgba(31,35,40,.15); color: #fff; font-weight: 600; }
button.primary:hover { background: #1a7f37; }

header { padding: 14px 24px 10px; border-bottom: 1px solid var(--border); background: var(--bg-subtle); position: sticky; top: 0; z-index: 40; }
header .title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 18px; font-weight: 600; }
header .meta { color: var(--fg-muted); font-size: 12px; }
.token-bar { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.token-bar input[type=password] {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
  width: 300px; font-family: var(--mono); font-size: 12px;
}
.token-bar select, .filters select {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--bg);
}
.token-note { font-size: 12px; color: var(--fg-muted); }
.token-note.ok { color: var(--green-fg); }
.token-wrap { display: flex; gap: 6px; align-items: center; }
.spacer { flex: 1; }
.progress { font-size: 12.5px; color: var(--blue-fg); }
.hint { font-size: 12px; color: var(--fg-muted); }

/* progress bar */
.progress-bar { height: 4px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--gray-bg); }
.progress-indeterminate {
  height: 100%; width: 40%; border-radius: 3px;
  background: linear-gradient(90deg, var(--blue-bg), var(--blue-fg), var(--blue-bg));
  animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

/* summary */
.summary { display: flex; gap: 8px; padding: 14px 24px 4px; flex-wrap: wrap; align-items: center; }
.stat {
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px;
  cursor: pointer; font-size: 13px; user-select: none; background: var(--bg);
}
.stat:hover { background: var(--bg-subtle); }
.stat.active { outline: 2px solid var(--blue-fg); }
.stat b { font-size: 15px; margin-right: 5px; }
.stat.s-merge b { color: var(--green-fg); }
.stat.s-owner b { color: var(--yellow-fg); }
.stat.s-label b { color: var(--purple-fg); }
.stat.s-author b, .stat.s-ci b, .stat.s-blocked b { color: var(--red-fg); }
.stat.s-run b, .stat.s-review b { color: var(--blue-fg); }
.stat.s-none b { color: var(--gray-fg); }
.stat.total { margin-left: auto; }

/* filters */
.filters { padding: 10px 24px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filters input[type=search], .filters input[type=text] {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
}
.filters input[type=search] { width: 260px; }
.filters input[type=text] { width: 200px; }
.filters .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--fg-muted); cursor: pointer; user-select: none; }
.filters .chk input { cursor: pointer; }
.filters .chk .chk-n { font-weight: 700; color: var(--fg); }
.filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--blue-bg); color: var(--blue-fg);
  border-radius: 10px; padding: 2px 10px; font-size: 12px; cursor: pointer;
}
.filter-chip .x { font-weight: 700; }
.count-note { padding: 0 24px 8px; color: var(--fg-muted); font-size: 12.5px; }

/* table */
.table-wrap { padding: 0 24px 40px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 1180px; table-layout: fixed; }
th, td { overflow-wrap: break-word; }
th {
  text-align: left; font-size: 12px; color: var(--fg-muted); font-weight: 600;
  border-bottom: 2px solid var(--border); padding: 8px 10px; white-space: nowrap;
  cursor: pointer; user-select: none; background: var(--bg-subtle);
}
th.no-sort { cursor: default; }
th:hover { color: var(--fg); }
td { border-bottom: 1px solid var(--border-soft); padding: 9px 10px; vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--bg-subtle); }
tbody tr.mine td { background: #fffdf0; }
tbody tr.mine:hover td { background: #fff8d6; }
tbody tr.refreshing { opacity: .5; }

.pr-title { font-weight: 600; }
.pr-title a { color: var(--fg); }
.pr-sub { color: var(--fg-muted); font-size: 12px; margin-top: 3px; }
.pr-refresh { color: var(--blue-fg); cursor: pointer; font-size: 12px; margin-left: 8px; white-space: nowrap; }
.pr-refresh:hover { text-decoration: underline; }
.pr-refresh.refreshing { color: var(--fg-muted); pointer-events: none; }
.pr-refresh.refreshing::before { content: "⟳"; display: inline-block; animation: spin .8s linear infinite; margin-right: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }

.label-chip {
  display: inline-block; border-radius: 10px; padding: 1px 9px;
  font-size: 11px; font-weight: 600; margin: 1px 3px 1px 0; white-space: nowrap;
}
.label-ready-precise { background: var(--green-bg); color: var(--green-fg); }
.label-main2main { background: var(--purple-bg); color: var(--purple-fg); }
.label-ready-a5 { background: var(--blue-bg); color: var(--blue-fg); }
.label-ci-run { background: var(--gray-bg); color: var(--gray-fg); }
.label-merge-conflicts, .label-vllm-break { background: var(--red-bg); color: var(--red-fg); }
.label-hold-on, .label-stale, .label-no-test, .label-no-main { background: var(--yellow-bg); color: var(--yellow-fg); }
.label-other { background: var(--gray-bg); color: var(--gray-fg); }
.label-missing { background: var(--yellow-bg); color: var(--yellow-fg); border: 1px dashed var(--yellow-fg); }

.reviewer {
  display: inline-flex; align-items: center; gap: 4px;
  margin: 1px 6px 1px 0; font-size: 12.5px; white-space: nowrap;
  border-radius: 10px; padding: 1px 9px; cursor: pointer;
}
.reviewer:hover { text-decoration: underline; }
.reviewer.approved { background: var(--green-bg); color: var(--green-fg); }
.reviewer.pending { background: var(--yellow-bg); color: var(--yellow-fg); }
.reviewer.changes { background: var(--red-bg); color: var(--red-fg); }
.reviewer.commented { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
/* A missing-owner group where ANY ONE member approving satisfies the file. */
.or-group {
  display: inline-block;
  border: 1.5px dashed var(--yellow-fg);
  background: var(--yellow-bg);
  border-radius: 10px;
  padding: 1px 7px;
  margin: 1px 6px 1px 0;
  line-height: 1.8;
  box-shadow: 0 0 0 1px rgba(154, 103, 0, 0.08);
}
.or-group::before {
  content: "任一";
  font-size: 10px;
  font-weight: 700;
  color: var(--yellow-fg);
  margin-right: 4px;
  vertical-align: 1px;
}
.or-group .reviewer { margin: 1px 0; background: #fff; }
.or-sep { color: var(--yellow-fg); font-size: 11px; font-weight: 700; }
.rv-line { line-height: 2.0; }
.rv-extra { font-size: 12px; color: var(--fg-muted); margin-top: 3px; }
.no-owner { color: var(--fg-muted); font-size: 12px; font-style: italic; }

.ci-badge {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 600;
  cursor: help; white-space: nowrap;
}
.ci-pass { background: var(--green-bg); color: var(--green-fg); }
.ci-fail { background: var(--red-bg); color: var(--red-fg); }
.ci-run { background: var(--blue-bg); color: var(--blue-fg); }
.ci-none { background: var(--gray-bg); color: var(--gray-fg); }
.ci-detail {
  display: none; position: fixed; z-index: 60;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 22px rgba(0,0,0,.15);
  padding: 10px 14px; min-width: 320px; max-width: 520px; font-size: 12.5px;
}
.ci-detail.show { display: block; }
.ci-detail .job { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
.ci-detail .job .name { font-family: var(--mono); font-size: 12px; }
.ci-detail .fail-reason { margin-top: 8px; border-top: 1px solid var(--border-soft); padding-top: 6px; color: var(--red-fg); }

.state-badge {
  display: inline-block; border-radius: 6px; padding: 2px 10px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.st-ready-to-merge { background: var(--green-bg); color: var(--green-fg); }
.st-needs-owner-approval { background: var(--yellow-bg); color: var(--yellow-fg); }
.st-needs-maintainer-label { background: var(--purple-bg); color: var(--purple-fg); }
.st-needs-author-action { background: var(--red-bg); color: var(--red-fg); }
.st-ci-failing { background: var(--red-bg); color: var(--red-fg); }
.st-ci-running { background: var(--blue-bg); color: var(--blue-fg); }
.st-awaiting-reviewers { background: var(--blue-bg); color: var(--blue-fg); }
.st-blocked { background: var(--darkred-bg); color: var(--darkred-fg); }
.st-draft { background: var(--gray-bg); color: var(--gray-fg); }
.st-no-ci { background: var(--gray-bg); color: var(--gray-fg); }
.blocker-note { font-size: 12px; color: var(--fg-muted); margin-top: 3px; }

.empty { text-align: center; color: var(--fg-muted); padding: 50px 20px; }
footer { padding: 12px 24px; color: var(--fg-muted); font-size: 12px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>vLLM Ascend · PR 状态一览</h1>
    <span class="meta" id="metaLine">尚未拉取数据</span>
  </div>
  <div class="token-bar">
    <div class="token-wrap">
      <input type="password" id="token" placeholder="GitHub token（gh auth token，只读即可）" autocomplete="off">
      <button id="saveToken">保存 token</button>
    </div>
    <select id="windowSel" title="获取范围：按最近 N 天，或按最新 N 页（每页 25 个）">
      <option value="d:1">最近 1 天</option>
      <option value="d:2">最近 2 天</option>
      <option value="d:3">最近 3 天</option>
      <option value="d:7" selected>最近 7 天</option>
      <option value="d:30">最近 30 天</option>
      <option value="d:90">最近 90 天</option>
      <option value="p:2">前 2 页 (~50)</option>
      <option value="p:4">前 4 页 (~100)</option>
      <option value="p:8">前 8 页 (~200)</option>
      <option value="p:20">前 20 页 (~500)</option>
      <option value="d:0">全量</option>
    </select>
    <button class="primary" id="fetchBtn">刷新数据</button>
    <button id="clearCache">清除缓存</button>
    <select id="autoRefresh" title="周期自动刷新">
      <option value="0">不自动刷新</option>
      <option value="5">每 5 分钟</option>
      <option value="10">每 10 分钟</option>
      <option value="15">每 15 分钟</option>
      <option value="30">每 30 分钟</option>
      <option value="60">每 1 小时</option>
    </select>
    <span class="token-note" id="autoNote"></span>
    <span class="token-note" id="tokenNote"></span>
    <span class="spacer"></span>
    <span class="progress" id="progress"></span>
    <span class="hint" id="rateLimit"></span>
  </div>
  <div id="progressBar" class="progress-bar" hidden><div class="progress-indeterminate"></div></div>
</header>

<div class="summary" id="cards"></div>

<div class="filters">
  <input type="search" id="fSearch" placeholder="搜索标题 / PR 号 / 作者…">
  <select id="fBucket"></select>
  <select id="fLabel"></select>
  <input type="text" id="myLogin" placeholder="输入你的 GitHub id（自动过滤待我处理）">
  <label class="chk" title="默认隐藏有 merge-conflicts 的 PR"><input type="checkbox" id="fShowMerge"> merge-conflicts <span class="chk-n" id="mergeCount"></span></label>
  <label class="chk" title="默认隐藏 draft PR"><input type="checkbox" id="fShowDraft"> draft <span class="chk-n" id="draftCount"></span></label>
  <select id="sortKey">
    <option value="importance">排序：处理优先级</option>
    <option value="age">排序：等待最久</option>
    <option value="number">排序：PR 号</option>
    <option value="ownerCount">排序：缺审批数</option>
  </select>
  <span id="activeFilters"></span>
  <button id="clearFilters">重置</button>
</div>

<div class="count-note" id="countNote"></div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th class="no-sort" style="width:9%">状态</th>
      <th class="no-sort" style="width:7%">CI</th>
      <th class="no-sort" style="width:29%">PR</th>
      <th class="no-sort" style="width:9%">标签</th>
      <th class="no-sort" style="width:21%">待处理（<span style="color:var(--yellow-fg)">◐</span> 分组内任一人 approve 即可）</th>
      <th class="no-sort" style="width:17%">已 Approve（<span style="color:var(--green-fg)">✓</span>）</th>
      <th data-sort="age" style="width:8%">等待</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<div class="empty" id="empty">尚未拉取。填入 token 后点击「刷新数据」；拉取完成后数据会缓存，刷新页面仍在。</div>

<div class="ci-detail" id="ciDetail"></div>

<footer>
  只读看板 · 点击任意行可单独刷新该 PR · 点击 reviewer 名按人筛选 · 悬停 CI 徽章查看失败明细 · 顶栏可选周期自动刷新（需已填 token）。
  数据来自 GitHub GraphQL，只保存在本机浏览器（localStorage）。
</footer>

<script>
"use strict";

const OWNER = "vllm-project";
const REPO = "vllm-ascend";
const TOKEN_KEY = "vllm-ascend-pr-triage-token";
const CACHE_KEY = "vllm-ascend-pr-triage-cache";
const PREF_KEY = "vllm-ascend-pr-triage-prefs";
const MARKER = "vllm-ascend-ci-gate-failure";
const GATE_CHECK_NAME = "ci-gate";

const BUCKETS = [
  ["blocked", "阻塞(冲突/挂起)", "st-blocked"],
  ["needs-maintainer-label", "需加标签", "st-needs-maintainer-label"],
  ["needs-owner-approval", "等 owner approve", "st-needs-owner-approval"],
  ["needs-author-action", "需作者修改", "st-needs-author-action"],
  ["ci-failing", "CI 失败", "st-ci-failing"],
  ["ci-running", "CI 运行中", "st-ci-running"],
  ["awaiting-reviewers", "等评审", "st-awaiting-reviewers"],
  ["ready-to-merge", "可合入", "st-ready-to-merge"],
  ["draft", "草稿", "st-draft"],
  ["no-ci", "待判定", "st-no-ci"],
];
const BUCKET_LABEL = Object.fromEntries(BUCKETS.map((b) => [b[0], b[1]]));
const BUCKET_CLASS = Object.fromEntries(BUCKETS.map((b) => [b[0], b[2]]));
const BUCKET_ORDER = Object.fromEntries(BUCKETS.map((b, i) => [b[0], i]));

const READY_LABELS = new Set(["ready-precise", "ready-a5", "main2main", "ci-run"]);
const KEY_LABELS = new Set([
  "ready-precise", "ready-a5", "main2main", "merge-conflicts",
  "hold-on", "no-test", "no-main", "stale", "vllm-break", "ci-run",
]);

const QUERY_LIST = `
query($cursor: String) {
  repository(owner: "${OWNER}", name: "${REPO}") {
    pullRequests(states: OPEN, first: 25, after: $cursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number title url isDraft mergeable createdAt updatedAt
        author { login }
        labels(first: 30) { nodes { name } }
        reviewRequests(first: 30) { nodes { requestedReviewer { __typename ... on User { login } ... on Team { name } } } }
        reviews(last: 40) { nodes { author { login } state submittedAt } }
        comments(last: 25) { nodes { author { login } body } }
        commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) { nodes {
          __typename
          ... on CheckRun { name conclusion status startedAt completedAt }
          ... on StatusContext { context state }
        } } } } } }
      }
    }
  }
}`;

const QUERY_SINGLE = `
query($number: Int!) {
  repository(owner: "${OWNER}", name: "${REPO}") {
    pullRequest(number: $number) {
      number title url isDraft mergeable createdAt updatedAt
      author { login }
      labels(first: 30) { nodes { name } }
      reviewRequests(first: 30) { nodes { requestedReviewer { __typename ... on User { login } ... on Team { name } } } }
      reviews(last: 40) { nodes { author { login } state submittedAt } }
      comments(last: 25) { nodes { author { login } body } }
      commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) { nodes {
        __typename
        ... on CheckRun { name conclusion status startedAt completedAt }
        ... on StatusContext { context state }
      } } } } } }
    }
  }
}`;

const state = {
  rows: [],
  mode: "d:7",
  myLogin: "",
  filters: { bucket: "", label: "", search: "", reviewer: "", showMerge: false, showDraft: false },
  sortKey: "importance",
  loading: false,
  collectedAt: null,
  autoMinutes: 0,
};

let autoTimer = null;
let autoTick = null;
let nextAutoAt = null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function daysSince(iso) {
  if (!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}

function relTime(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}

function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); } catch { return {}; }
}
function savePrefs() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify({ mode: state.mode, myLogin: state.myLogin, autoMinutes: state.autoMinutes })); } catch {}
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (c && Array.isArray(c.rows)) return c;
  } catch {}
  return null;
}
function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      collectedAt: state.collectedAt, mode: state.mode, rows: state.rows,
    }));
  } catch (e) {
    setMeta("缓存保存失败（数据过大），本次仅内存保留");
  }
}

function setMeta(text) { $("metaLine").textContent = text; }
function updateRateLimit(remaining) { $("rateLimit").textContent = "API 余量: " + remaining; }
function showProgress(text) { $("progress").textContent = text; $("progressBar").hidden = false; }
function hideProgress() { $("progress").textContent = ""; $("progressBar").hidden = true; }

// Periodic auto-refresh. Interval 0 disables it.
function scheduleAuto(minutes) {
  clearInterval(autoTimer);
  clearInterval(autoTick);
  autoTimer = null; autoTick = null; nextAutoAt = null;
  const note = $("autoNote");
  if (!minutes) { note.textContent = ""; return; }
  const ms = minutes * 60000;
  autoTimer = setInterval(() => {
    if (!getToken()) return; // skip until a token is set
    nextAutoAt = Date.now() + ms;
    fetchList();
  }, ms);
  nextAutoAt = Date.now() + ms;
  autoTick = setInterval(() => {
    if (!nextAutoAt) { note.textContent = ""; return; }
    if (state.loading) { note.textContent = "· 正在刷新…"; return; }
    const left = Math.max(0, nextAutoAt - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    note.textContent = `· 下次自动刷新 ${m}:${String(s).padStart(2, "0")}`;
  }, 1000);
  note.textContent = `· 每 ${minutes} 分钟`;
}

async function graphql(query, variables) {
  const token = getToken();
  if (!token) throw new Error("请先填入并保存 GitHub token");
  const res = await fetch("https://api.github.com/graphql", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
      "Accept": "application/vnd.github+json",
    },
    body: JSON.stringify({ query, variables: variables || {} }),
  });
  const remaining = res.headers.get("X-RateLimit-Remaining");
  if (remaining != null) updateRateLimit(remaining);
  if (res.status === 401) throw new Error("token 无效或已过期 (401)");
  if (res.status === 403) throw new Error("请求被拒绝 (403)，可能触发限流，剩余 " + (remaining || "?"));
  if (res.status === 502 || res.status === 504) throw new Error("GitHub API 网关超时 (" + res.status + ")，请重试或缩小时间窗口");
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("响应解析失败 (HTTP " + res.status + "): " + e.message); }
  if (data.errors && data.errors.length) throw new Error(data.errors.map((e) => e.message).join("; "));
  if (!res.ok && !data.data) throw new Error("请求失败 (HTTP " + res.status + ")");
  return data.data;
}

function latestReviews(reviewNodes) {
  const latest = new Map();
  for (const r of reviewNodes || []) {
    const login = r.author && r.author.login;
    if (!login) continue;
    const t = new Date(r.submittedAt || 0).getTime();
    const prev = latest.get(login);
    if (!prev || t >= prev.t) latest.set(login, { state: r.state, t });
  }
  return latest;
}

function pickCheck(contexts, name) {
  let best = null;
  for (const c of contexts || []) {
    const nm = c.name || c.context;
    if (nm !== name) continue;
    const started = new Date(c.startedAt || 0).getTime();
    if (!best || started >= best.started) best = { started, c };
  }
  if (!best) return null;
  const c = best.c;
  return { conclusion: c.conclusion || null, status: c.status || null, state: c.state || null };
}

function parseGateComment(comments) {
  for (const c of comments || []) {
    const body = c.body || "";
    if (!body.includes(MARKER)) continue;
    let reason = "";
    const m = body.match(/\*\*ci-gate failed\.\*\* Reason:\s*\n+\s*>\s*([^\n]+)/);
    if (m) reason = m[1].trim();
    // Each "waiting for approval from one of: @a, @b" line is ONE file that
    // is satisfied by ANY single owner in that list (OR semantics). Keep the
    // per-file groups instead of flattening, so the UI can show "任一".
    const groups = [];
    const seen = new Set();
    const re = /waiting for approval from one of:[ \t]*([^\n]+)/g;
    let mm;
    while ((mm = re.exec(body))) {
      const owners = (mm[1].match(/@[\w.-]+/g) || []);
      if (!owners.length) continue;
      const sig = owners.slice().sort().join(",");
      if (seen.has(sig)) continue;
      seen.add(sig);
      groups.push(owners);
    }
    const missingOwners = Array.from(new Set(groups.flat()));
    return { reason, groups, missingOwners };
  }
  return null;
}

function processNode(n) {
  const labels = (n.labels && n.labels.nodes || []).map((l) => l.name);
  const author = (n.author && n.author.login) || "?";
  const requested = (n.reviewRequests && n.reviewRequests.nodes || [])
    .map((r) => r.requestedReviewer || {})
    .map((r) => ({ login: r.login || null, team: r.name || null }))
    .filter((r) => r.login || r.team);

  const latest = latestReviews(n.reviews && n.reviews.nodes);
  const approvals = [], changes = [], commented = [];
  for (const [login, v] of latest) {
    if (v.state === "APPROVED" || v.state === "DISMISSED") approvals.push(login);
    else if (v.state === "CHANGES_REQUESTED") changes.push(login);
    else if (v.state === "COMMENTED") commented.push(login);
  }

  const contexts = ((n.commits && n.commits.nodes && n.commits.nodes[0]
    && n.commits.nodes[0].commit && n.commits.nodes[0].commit.statusCheckRollup
    && n.commits.nodes[0].commit.statusCheckRollup.contexts
    && n.commits.nodes[0].commit.statusCheckRollup.contexts.nodes) || []);

  const gate = pickCheck(contexts, GATE_CHECK_NAME);
  const failingChecks = [];
  const seen = new Set();
  for (const c of contexts) {
    const nm = c.name || c.context;
    const concl = c.conclusion || c.state;
    if (nm && concl === "FAILURE" && !seen.has(nm)) { failingChecks.push(nm); seen.add(nm); }
  }

  const gateComment = parseGateComment(n.comments && n.comments.nodes);
  const missingOwnerGroups = gateComment ? gateComment.groups : [];
  const missingOwners = gateComment ? gateComment.missingOwners : [];

  const approvedSet = new Set(approvals);
  const pendingReviewers = [];
  for (const r of requested) {
    if (r.login) { if (!approvedSet.has(r.login)) pendingReviewers.push(r.login); }
    else if (r.team) pendingReviewers.push(r.team + " (team)");
  }

  const row = {
    number: n.number,
    title: n.title || "",
    url: n.url || ("https://github.com/" + OWNER + "/" + REPO + "/pull/" + n.number),
    author,
    createdAt: n.createdAt,
    updatedAt: n.updatedAt,
    isDraft: !!n.isDraft,
    mergeable: n.mergeable || "UNKNOWN",
    labels,
    readyLabels: labels.filter((l) => READY_LABELS.has(l)),
    keyLabels: labels.filter((l) => KEY_LABELS.has(l)),
    approvals, changes, commented, requested, pendingReviewers,
    gate, failingChecks,
    gateReason: gateComment ? gateComment.reason : "",
    missingOwners, missingOwnerGroups,
  };
  row.bucket = computeBucket(row);
  return row;
}

function computeBucket(row) {
  if (row.isDraft) return "draft";
  const blockedLabels = ["merge-conflicts", "hold-on", "vllm-break", "stale"];
  if (row.mergeable === "CONFLICTING" || row.labels.some((l) => blockedLabels.includes(l))) return "blocked";

  const g = row.gate;
  const reason = (row.gateReason || "").toLowerCase();

  if (g && g.status && g.status !== "COMPLETED") return "ci-running";
  if (g && (g.conclusion === "CANCELLED" || g.conclusion === "TIMED_OUT")) return "ci-failing";

  if (g && g.conclusion === "FAILURE") {
    // A gate-failure comment can be stale: it may have been posted before a
    // ready-precise / main2main label was added. Only flag "needs label"
    // when the run-enabling label is actually missing.
    const hasReady = row.labels.includes("ready-precise") || row.labels.includes("main2main");
    if (!hasReady && (reason.includes("ready-precise") || reason.includes("main2main") || reason.includes("label"))) {
      return "needs-maintainer-label";
    }
    if (reason.includes("codeowners") || row.missingOwners.length) return "needs-owner-approval";
    return "ci-failing";
  }

  if (row.changes.length) return "needs-author-action";

  const gateOk = g && g.conclusion === "SUCCESS";
  if (gateOk) {
    if (row.approvals.length && row.pendingReviewers.length === 0) return "ready-to-merge";
    return "awaiting-reviewers";
  }

  if (!g) {
    if (row.pendingReviewers.length) return "awaiting-reviewers";
    return "no-ci";
  }
  return "no-ci";
}

function blockerText(row) {
  switch (row.bucket) {
    case "needs-maintainer-label": return "有 src 改动，maintainer 需打 ready-precise / main2main";
    case "needs-owner-approval": return row.missingOwnerGroups && row.missingOwnerGroups.length ? ("缺 owner 审批（任一人 approve 即可）") : "CODEOWNERS owner 未审批";
    case "ci-failing": {
      const hasReady = row.labels.includes("ready-precise") || row.labels.includes("main2main");
      const stale = row.gateReason && hasReady && /ready-precise|main2main|select-tests was skipped/i.test(row.gateReason);
      if (stale) return "ready-precise 已加，当前 gate 结果为加标签前，等待 CI 重跑";
      return row.gateReason || (row.failingChecks.length ? ("失败: " + row.failingChecks.slice(0, 3).join(", ")) : "CI 检查失败");
    }
    case "ci-running": return "NPU 测试排队 / 运行中";
    case "awaiting-reviewers": return row.pendingReviewers.length ? ("等 " + row.pendingReviewers.length + " 人评审") : "等待评审";
    case "needs-author-action": return "reviewer 提了 changes requested";
    case "ready-to-merge": return "CI 绿且已 approve，可合入";
    case "blocked": return "冲突或被挂起";
    case "draft": return "草稿 PR";
    default: return "待判定";
  }
}

function ciState(row) {
  const g = row.gate;
  if (!g) return "none";
  if (g.status && g.status !== "COMPLETED") return "run";
  if (g.conclusion === "SUCCESS") return "pass";
  if (g.conclusion === "FAILURE") return "fail";
  return "none";
}

// ---------- filtering / sorting ----------
function myQueueSet() {
  const me = state.myLogin.trim().toLowerCase();
  const out = new Set();
  if (!me) return out;
  for (const row of state.rows) {
    const pend = row.pendingReviewers.some((p) => p.toLowerCase() === me);
    const miss = row.missingOwners.some((o) => o.replace(/^@/, "").toLowerCase() === me);
    if (pend || miss) out.add(row.number);
  }
  return out;
}

function isMergeConflict(row) {
  return row.mergeable === "CONFLICTING" || row.labels.includes("merge-conflicts");
}

// Rows hidden unless their toggle is on.
function hiddenByDefault(row) {
  return (!state.filters.showMerge && isMergeConflict(row)) || (!state.filters.showDraft && row.isDraft);
}

function filteredRows() {
  const f = state.filters;
  const q = f.search.trim().toLowerCase();
  const me = state.myLogin.trim().toLowerCase();
  const mine = myQueueSet();
  let rows = state.rows.filter((row) => {
    if (hiddenByDefault(row)) return false;
    // 待我处理：输入自己的 id 后，只保留需要我评审/审批的 PR
    if (me && !mine.has(row.number)) return false;
    if (f.bucket && row.bucket !== f.bucket) return false;
    if (f.label && !row.labels.includes(f.label)) return false;
    if (f.reviewer) {
      const rv = f.reviewer.toLowerCase();
      const pend = row.pendingReviewers.some((p) => p.toLowerCase() === rv);
      const miss = row.missingOwners.some((o) => o.replace(/^@/, "").toLowerCase() === rv);
      const appr = row.approvals.some((a) => a.toLowerCase() === rv);
      if (!pend && !miss && !appr) return false;
    }
    if (q && !(String(row.number).includes(q) || row.title.toLowerCase().includes(q) || row.author.toLowerCase().includes(q))) return false;
    return true;
  });
  rows.forEach((r) => { r._mine = mine.has(r.number); });
  rows.sort((a, b) => {
    if (state.sortKey === "age") return daysSince(b.createdAt) - daysSince(a.createdAt);
    if (state.sortKey === "number") return b.number - a.number;
    if (state.sortKey === "ownerCount") return (b.missingOwners.length + b.pendingReviewers.length) - (a.missingOwners.length + a.pendingReviewers.length);
    const d = BUCKET_ORDER[a.bucket] - BUCKET_ORDER[b.bucket];
    return d !== 0 ? d : (new Date(b.updatedAt) - new Date(a.updatedAt));
  });
  return rows;
}

// ---------- rendering ----------
function renderCards() {
  const me = state.myLogin.trim().toLowerCase();
  const mine = myQueueSet();
  const visible = state.rows.filter((r) => !hiddenByDefault(r) && (!me || mine.has(r.number)));
  const counts = {};
  for (const row of visible) counts[row.bucket] = (counts[row.bucket] || 0) + 1;
  const clsMap = { blocked: "s-blocked", "needs-owner-approval": "s-owner", "needs-maintainer-label": "s-label",
    "needs-author-action": "s-author", "ci-failing": "s-ci", "ci-running": "s-run",
    "awaiting-reviewers": "s-review", "ready-to-merge": "s-merge", draft: "s-none", "no-ci": "s-none" };
  let html = BUCKETS
    .filter(([k]) => counts[k])
    .map(([k, label]) => `<span class="stat ${clsMap[k]} ${state.filters.bucket === k ? "active" : ""}" data-bucket="${k}"><b>${counts[k]}</b>${esc(label)}</span>`)
    .join("");
  html += `<span class="stat total ${state.filters.bucket === "" ? "active" : ""}" data-bucket=""><b>${visible.length}</b>全部 open PR</span>`;
  $("cards").innerHTML = html;
  $("cards").querySelectorAll(".stat").forEach((el) => {
    el.addEventListener("click", () => {
      const b = el.dataset.bucket;
      state.filters.bucket = (state.filters.bucket === b && b !== "") ? "" : b;
      $("fBucket").value = state.filters.bucket;
      renderTable(); renderCards();
    });
  });
}

function renderFilters() {
  const bsel = $("fBucket");
  bsel.innerHTML = '<option value="">全部分类</option>' + BUCKETS.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("");
  bsel.value = state.filters.bucket;

  const allLabels = new Set();
  state.rows.forEach((r) => r.labels.forEach((l) => allLabels.add(l)));
  const lsel = $("fLabel");
  lsel.innerHTML = '<option value="">全部标签</option>' +
    Array.from(allLabels).sort().map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
  lsel.value = state.filters.label;

  const el = $("activeFilters");
  let chips = "";
  if (state.filters.reviewer) chips += `<span class="filter-chip" id="chipReviewer">@${esc(state.filters.reviewer)} <span class="x">×</span></span>`;
  if (state.myLogin.trim()) chips += `<span class="filter-chip" id="chipMine">待我处理: ${esc(state.myLogin.trim())} <span class="x">×</span></span>`;
  el.innerHTML = chips;
  const c1 = $("chipReviewer"); if (c1) c1.addEventListener("click", () => { state.filters.reviewer = ""; render(); });
  const c2 = $("chipMine"); if (c2) c2.addEventListener("click", () => { state.myLogin = ""; $("myLogin").value = ""; savePrefs(); render(); });

  // Toggle counts: how many PRs are hidden by default in each category.
  $("mergeCount").textContent = state.rows.filter(isMergeConflict).length || "";
  $("draftCount").textContent = state.rows.filter((r) => r.isDraft).length || "";
  $("fShowMerge").checked = state.filters.showMerge;
  $("fShowDraft").checked = state.filters.showDraft;
}

function labelChip(l) {
  let cls = "label-other";
  if (READY_LABELS.has(l)) cls = "label-" + l;
  else if (["merge-conflicts", "vllm-break"].includes(l)) cls = "label-merge-conflicts";
  else if (["hold-on", "stale", "no-test", "no-main"].includes(l)) cls = "label-hold-on";
  return `<span class="label-chip ${cls}">${esc(l)}</span>`;
}

function reviewerPill(user, kind) {
  const map = { approved: ["✓", "approved"], pending: ["◐", "pending"], changes: ["✗", "changes"], commented: ["○", "commented"] };
  const [icon, cls] = map[kind];
  return `<span class="reviewer ${cls}" data-user="${esc(user.replace(/^@/, ""))}" title="${esc(user)}">${icon} ${esc(user.replace(/^@/, ""))}</span>`;
}

function pendingCell(row) {
  const approved = new Set(row.approvals.map((a) => a.toLowerCase()));
  const changes = new Set(row.changes.map((c) => c.toLowerCase()));
  const rendered = new Set();
  const parts = [];
  const pushGroup = (members) => {
    const pills = members.map((m) => reviewerPill(m, changes.has(m.replace(/^@/, "").toLowerCase()) ? "changes" : "pending"));
    members.forEach((m) => rendered.add(m.replace(/^@/, "").toLowerCase()));
    if (members.length === 1) parts.push(pills[0]);
    else parts.push(`<span class="or-group" title="这些 owner 中任一人 approve 即可满足对应文件（或关系）">${pills.join('<span class="or-sep"> 或 </span>')}</span>`);
  };
  // Per-file OR groups: drop satisfied groups (any member already approved),
  // and drop members who already approved from the remaining groups.
  (row.missingOwnerGroups || []).forEach((g) => {
    const remaining = g.filter((o) => !approved.has(o.replace(/^@/, "").toLowerCase()));
    if (remaining.length) pushGroup(remaining);
  });
  // Explicit review requests not covered by an owner group.
  (row.pendingReviewers || []).forEach((p) => {
    const key = p.toLowerCase();
    if (approved.has(key) || rendered.has(key)) return;
    parts.push(reviewerPill(p, changes.has(key) ? "changes" : "pending"));
    rendered.add(key);
  });
  // Remaining changes-requested reviewers.
  row.changes.forEach((c) => {
    const key = c.toLowerCase();
    if (rendered.has(key)) return;
    parts.push(reviewerPill(c, "changes"));
    rendered.add(key);
  });
  if (!parts.length) return '<span class="no-owner">无待处理</span>';
  return `<div class="rv-line">${parts.join("")}</div>`;
}

function approvedCell(row) {
  if (!row.approvals.length) return '<span class="no-owner">—</span>';
  return `<div class="rv-line">${row.approvals.map((a) => reviewerPill(a, "approved")).join("")}</div>`;
}

function renderTable() {
  const rows = filteredRows();
  const tbody = $("tbody");
  const empty = $("empty");
  if (!state.rows.length) {
    tbody.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = "尚未拉取。填入 token 后点击「刷新数据」；拉取完成后数据会缓存，刷新页面仍在。";
    $("countNote").textContent = "";
    return;
  }
  empty.style.display = rows.length ? "none" : "block";
  if (!rows.length) empty.textContent = "当前筛选条件下没有 PR。";

  const hiddenMerge = !state.filters.showMerge ? state.rows.filter(isMergeConflict).length : 0;
  const hiddenDraft = !state.filters.showDraft ? state.rows.filter((r) => r.isDraft).length : 0;
  const hidden = hiddenMerge + hiddenDraft;
  $("countNote").textContent = `显示 ${rows.length} / ${state.rows.length} 个 open PR` +
    (state.myLogin.trim() ? ` · 待我处理（@${state.myLogin.trim()}）` : "") +
    (hidden ? `（已隐藏 ${hiddenMerge} 个 merge-conflicts、${hiddenDraft} 个 draft）` : "") +
    (state.filters.reviewer ? ` · reviewer: @${state.filters.reviewer}` : "") +
    (state.filters.bucket ? ` · 状态: ${BUCKET_LABEL[state.filters.bucket]}` : "");

  tbody.innerHTML = rows.map((row) => {
    const st = row.bucket;
    const ci = ciState(row);
    const ciCls = { pass: "ci-pass", fail: "ci-fail", run: "ci-run", none: "ci-none" }[ci];
    const ciTxt = { pass: "✓ ci-gate 绿", fail: "✗ ci-gate 红", run: "● 运行中", none: "— 未触发" }[ci];
    const chips = row.readyLabels.map(labelChip).join("") +
      row.keyLabels.filter((l) => !READY_LABELS.has(l)).map(labelChip).join("") ||
      '<span class="no-owner">—</span>';
    const d = daysSince(row.createdAt);
    const ageStyle = d >= 14 ? "color:var(--red-fg);font-weight:600" : d >= 7 ? "color:var(--yellow-fg)" : "";
    return `<tr data-number="${row.number}" class="${row._mine && !state.myLogin.trim() ? "mine" : ""}">
      <td>
        <span class="state-badge ${BUCKET_CLASS[st]}">${esc(BUCKET_LABEL[st])}</span>
        <div class="blocker-note">${esc(blockerText(row))}</div>
      </td>
      <td><span class="ci-badge ${ciCls}" data-pr="${row.number}">${ciTxt}</span></td>
      <td>
        <div class="pr-title"><a href="${esc(row.url)}" target="_blank" rel="noopener">${esc(row.title)}</a></div>
        <div class="pr-sub">#${row.number} · ${esc(row.author)} · 更新于 ${esc(relTime(row.updatedAt))}
          <span class="pr-refresh" data-pr="${row.number}" title="只刷新这个 PR">⟳ 刷新</span>
        </div>
      </td>
      <td>${chips}</td>
      <td>${pendingCell(row)}</td>
      <td>${approvedCell(row)}</td>
      <td><span style="${ageStyle}" title="创建于 ${esc(row.createdAt)}">${d}d</span></td>
    </tr>`;
  }).join("");

  bindRows();
}

function bindRows() {
  const tbody = $("tbody");
  tbody.querySelectorAll("tr").forEach((tr) => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a, .reviewer, .ci-badge, .pr-refresh")) return;
      refreshOne(Number(tr.dataset.number));
    });
  });
  tbody.querySelectorAll(".pr-refresh").forEach((el) => {
    el.addEventListener("click", (e) => { e.stopPropagation(); refreshOne(Number(el.dataset.pr), el); });
  });
  tbody.querySelectorAll(".reviewer").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const u = el.dataset.user;
      state.filters.reviewer = (state.filters.reviewer === u) ? "" : u;
      render();
    });
  });
  tbody.querySelectorAll(".ci-badge").forEach((el) => {
    el.addEventListener("mouseenter", () => showCiDetail(el));
    el.addEventListener("mouseleave", () => { scheduleHideCi(); });
  });
}

function showCiDetail(el) {
  const row = state.rows.find((r) => r.number === +el.dataset.pr);
  if (!row) return;
  const box = $("ciDetail");
  let inner = `<b style="font-size:13px">E2E · #${row.number}</b>`;
  const ci = ciState(row);
  if (ci === "none" && !row.gate) {
    inner += '<div style="color:var(--fg-muted);margin-top:6px">无 ci-gate 检查（未触发或尚未产生）</div>';
  } else {
    const checks = row.failingChecks;
    if (ci === "fail" && checks.length) {
      inner += checks.map((n) => `<div class="job"><span class="name">${esc(n)}</span><span style="color:var(--red-fg)">✗ failure</span></div>`).join("");
    } else if (ci === "run") {
      inner += '<div style="color:var(--blue-fg);margin-top:6px">CI 运行中…</div>';
    } else if (ci === "pass") {
      inner += '<div style="color:var(--green-fg);margin-top:6px">ci-gate 通过</div>';
    }
    if (row.gateReason) inner += `<div class="fail-reason">${esc(row.gateReason)}</div>`;
  }
  box.innerHTML = inner;
  const r = el.getBoundingClientRect();
  box.style.left = Math.min(r.left, window.innerWidth - 540) + "px";
  box.style.top = (r.bottom + 6) + "px";
  box.classList.add("show");
  box.onmouseenter = () => clearTimeout(box._t);
  box.onmouseleave = () => { box.classList.remove("show"); };
}
function scheduleHideCi() {
  const box = $("ciDetail");
  box._t = setTimeout(() => box.classList.remove("show"), 200);
}

function render() { renderCards(); renderFilters(); renderTable(); }

function cacheMeta() {
  if (!state.collectedAt) return `共 ${state.rows.length} 个 open PR`;
  const mins = Math.round((Date.now() - new Date(state.collectedAt).getTime()) / 60000);
  const when = new Date(state.collectedAt).toLocaleString();
  return `${state.rows.length} 个 open PR · 采集于 ${when}（${mins} 分钟前）`;
}

// ---------- fetch ----------
async function fetchList() {
  if (state.loading) return;
  if (!getToken()) { setMeta("请先填入并保存 GitHub token，再刷新数据"); return; }
  state.loading = true;
  $("fetchBtn").disabled = true;
  showProgress("采集中…");
  const mode = state.mode || "d:7";
  const mDays = mode.startsWith("d:") ? Number(mode.slice(2)) : 0;   // 0 => all days
  const mPages = mode.startsWith("p:") ? Number(mode.slice(2)) : 0;  // 0 => no page cap
  const cutoff = mDays ? Date.now() - mDays * 24 * 3600 * 1000 : 0;
  const rows = [];
  let cursor = null;
  let pages = 0;
  try {
    while (true) {
      let data = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try { data = await graphql(QUERY_LIST, { cursor }); break; }
        catch (err) {
          const transient = /504|502|network|fetch|超时/i.test(err.message);
          if (attempt === 3 || !transient) throw err;
          showProgress(`第 ${pages + 1} 页请求失败，重试 (${attempt}/3)…`);
          await new Promise((r) => setTimeout(r, 1500 * attempt));
        }
      }
      const conn = data.repository.pullRequests;
      let stop = false;
      for (const n of conn.nodes) {
        if (cutoff && new Date(n.updatedAt).getTime() < cutoff) { stop = true; break; }
        rows.push(processNode(n));
      }
      pages++;
      const capTxt = mPages ? `（上限 ${mPages} 页）` : "";
      showProgress(`采集中… 已 ${rows.length} 个 PR（第 ${pages} 页${capTxt}）`);
      if (stop || (mPages && pages >= mPages) || !conn.pageInfo.hasNextPage) break;
      cursor = conn.pageInfo.endCursor;
      if (pages > 200) break;
      state.rows = rows.slice();
      renderFilters(); render();
    }
    state.rows = rows;
    state.collectedAt = new Date().toISOString();
    saveCache();
    renderFilters(); render();
    setMeta(cacheMeta());
  } catch (e) {
    setMeta("拉取失败：" + e.message + (state.rows.length ? "（仍显示上次数据）" : ""));
  } finally {
    state.loading = false;
    $("fetchBtn").disabled = false;
    hideProgress();
  }
}

async function refreshOne(number, el) {
  const tr = document.querySelector(`tr[data-number="${number}"]`);
  if (tr) tr.classList.add("refreshing");
  if (el) el.classList.add("refreshing");
  try {
    const data = await graphql(QUERY_SINGLE, { number });
    const n = data.repository.pullRequest;
    if (!n) throw new Error("PR 不存在");
    const row = processNode(n);
    const idx = state.rows.findIndex((r) => r.number === number);
    if (idx >= 0) state.rows[idx] = row; else state.rows.push(row);
    saveCache();
    render();
    setMeta(`#${number} 已刷新 · ` + cacheMeta());
  } catch (e) {
    setMeta(`刷新 #${number} 失败：` + e.message);
    if (tr) tr.classList.remove("refreshing");
    if (el) el.classList.remove("refreshing");
  }
}

// ---------- init ----------
function init() {
  const prefs = loadPrefs();
  if (prefs.mode) state.mode = prefs.mode;
  if (prefs.myLogin) state.myLogin = prefs.myLogin;
  if (prefs.autoMinutes != null) state.autoMinutes = Number(prefs.autoMinutes) || 0;

  const saved = getToken();
  if (saved) $("token").value = saved;
  $("windowSel").value = state.mode;
  $("myLogin").value = state.myLogin || "";
  $("autoRefresh").value = String(state.autoMinutes);

  const tokenNote = () => {
    const has = !!getToken();
    $("tokenNote").textContent = has ? "✓ token 已保存在本机" : "未设置 token";
    $("tokenNote").className = "token-note" + (has ? " ok" : "");
  };
  tokenNote();

  $("saveToken").addEventListener("click", () => {
    const v = $("token").value.trim();
    if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY);
    tokenNote();
    setMeta(v ? "token 已保存" : "token 已清除");
  });
  $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("saveToken").click(); });

  $("fetchBtn").addEventListener("click", () => {
    const v = $("token").value.trim();
    if (v) localStorage.setItem(TOKEN_KEY, v);
    state.mode = $("windowSel").value;
    savePrefs();
    fetchList();
  });
  $("windowSel").addEventListener("change", () => { state.mode = $("windowSel").value; savePrefs(); });
  $("autoRefresh").addEventListener("change", () => {
    state.autoMinutes = Number($("autoRefresh").value) || 0;
    savePrefs();
    scheduleAuto(state.autoMinutes);
  });
  $("clearCache").addEventListener("click", () => {
    localStorage.removeItem(CACHE_KEY);
    state.rows = []; state.collectedAt = null;
    renderFilters(); render();
    setMeta("缓存已清除");
  });

  $("myLogin").addEventListener("input", (e) => { state.myLogin = e.target.value; savePrefs(); render(); });
  $("fSearch").addEventListener("input", (e) => { state.filters.search = e.target.value; renderTable(); });
  $("fBucket").addEventListener("change", (e) => { state.filters.bucket = e.target.value; renderCards(); renderTable(); });
  $("fLabel").addEventListener("change", (e) => { state.filters.label = e.target.value; renderTable(); });
  $("fShowMerge").addEventListener("change", (e) => { state.filters.showMerge = e.target.checked; renderCards(); renderTable(); });
  $("fShowDraft").addEventListener("change", (e) => { state.filters.showDraft = e.target.checked; renderCards(); renderTable(); });
  $("sortKey").addEventListener("change", (e) => { state.sortKey = e.target.value; renderTable(); });
  $("clearFilters").addEventListener("click", () => {
    state.filters = { bucket: "", label: "", search: "", reviewer: "", showMerge: false, showDraft: false };
    $("fBucket").value = ""; $("fLabel").value = ""; $("fSearch").value = "";
    render();
  });

  document.querySelectorAll("th[data-sort]").forEach((th) => {
    th.addEventListener("click", () => {
      state.sortKey = state.sortKey === "age" ? "importance" : "age";
      $("sortKey").value = state.sortKey;
      renderTable();
    });
  });

  // boot from cache (rows only; the fetch window stays the user's last choice)
  const cache = loadCache();
  if (cache) {
    state.rows = cache.rows;
    state.collectedAt = cache.collectedAt;
    renderFilters(); render();
    setMeta(cacheMeta());
  } else {
    renderFilters(); render();
    setMeta("尚未拉取数据");
  }

  scheduleAuto(state.autoMinutes);
}

init();
</script>
